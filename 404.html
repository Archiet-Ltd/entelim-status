<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entelim is back shortly</title>
<style>
  :root { --bg:#f7f8fa; --fg:#14171f; --muted:#5b6270; --accent:#2f5bea; --card:#ffffff; --line:#e3e6ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --fg:#eef0f4; --muted:#a3aab8; --accent:#7f9cff; --card:#171b23; --line:#262b36; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  main { max-width:560px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:40px 32px; }
  .brand { font-weight:700; letter-spacing:.02em; color:var(--accent); margin:0 0 24px; }
  h1 { font-size:1.6rem; line-height:1.25; margin:0 0 12px; }
  p { margin:0 0 12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <p class="brand">Entelim</p>
  <h1>We'll be back shortly</h1>
  <p>Entelim is offline for a short while as we complete work with our hosting provider.</p>
  <p>Please check back soon.</p>
</main>
</body>
</html>
